# 임베딩 호출 트레이스에 쓰는 설정.
#
# config.yml 과 다른 점은 임베더뿐이다. 여기서는 해시 임베더로 교체하지 않고,
# 스크립트가 로컬에 띄우는 OpenAI 호환 스텁 서버(127.0.0.1:18099)를 향하게 한다.
# 그래야 운영과 같은 OpenAIEmbedder 구현이 실제로 HTTP 요청을 만들고,
# 그 요청 수와 입력 개수를 셀 수 있다.
#
# stub_embedder_batch2 는 batch_size 설정이 호출 분할에 미치는 영향을
# 확인하기 위한 것이다.

logging:
  path: mm_embed.log
  level: error

episode_store:
  database: pg

episodic_memory:
  long_term_memory:
    backend: event
    embedder: stub_embedder
    vector_store: event_vector_store
    segment_store: pg
  short_term_memory:
    llm_model: openai_model
    message_capacity: 500

retrieval_agent:
  llm_model: openai_model
  reranker: my_reranker_id

semantic_memory:
  llm_model: openai_model
  embedding_model: stub_embedder
  database: pg
  config_database: pg

session_manager:
  database: pg

prompt:
  default_project_categories: [profile_prompt]

resources:
  databases:
    pg:
      provider: postgres
      config:
        host: 127.0.0.1
        port: 15432
        user: postgres
        password: mmtest
        db_name: postgres
    event_vector_store:
      provider: qdrant
      config:
        host: 127.0.0.1
        port: 16333
        grpc_port: 16334
        prefer_grpc: false
        https: false
  embedders:
    stub_embedder:
      provider: openai
      config:
        model: "text-embedding-3-small"
        api_key: "stub"
        base_url: "http://127.0.0.1:18099/v1"
        dimensions: 1536
    stub_embedder_batch2:
      provider: openai
      config:
        model: "text-embedding-3-small"
        api_key: "stub"
        base_url: "http://127.0.0.1:18099/v1"
        dimensions: 1536
        batch_size: 2
  language_models:
    openai_model:
      provider: openai-responses
      config:
        model: "gpt-4o-mini"
        api_key: "unused-stubbed-in-test"
        base_url: "https://api.openai.com/v1"
  rerankers:
    my_reranker_id:
      provider: "identity"
