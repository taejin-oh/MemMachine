[project]
name = "mock-inference"
version = "0.1.0"
description = "Mock OpenAI-embeddings and Cohere/vLLM-rerank server that serves real dataset vectors"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "uvicorn>=0.30",
    "uvloop>=0.19; sys_platform != 'win32'",
    "httptools>=0.6",
    "orjson>=3.9",
    "xxhash>=3.4",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
checks = ["openai>=1.50", "cohere>=5.20", "httpx>=0.27"]

[project.scripts]
mock-inference = "mock_inference.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mock_inference*"]
