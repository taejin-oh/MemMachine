# Model profile placeholder
#
# 한 모델 프로파일 = (embedder + rerankers + llm_model + 선택적 judge_llm) 셋
# generate_config.py 가 이 셋을 읽어 configuration.yml 의
#   - episodic_memory.long_term_memory.embedder / reranker
#   - retrieval_agent.llm_model / reranker / judge_llm_model
#   - resources.embedders / language_models / rerankers
# 섹션을 자동 구성합니다.
#
# rerankers 는 list. 단일 reranker 면 항목 1개. rrf-hybrid 같은 메타 reranker 를
# 쓰려면 그 안에 결합할 reranker 들과 hybrid 자체를 같이 등록하고
# primary_reranker 로 위쪽이 가리킬 id 를 지정합니다.
#
# 사용법: 이 파일을 복사해 configs/profiles/models/{내가정한이름}.yaml 로 저장,
#         아래 placeholder 를 실제 값으로 채운 뒤
#         base.yaml 의 configuration.model_profile 에 그 이름을 적습니다.

embedder:
  id: my_embedder
  provider: openai
  config:
    api_key: "<OPENAI_API_KEY>"
    base_url: https://api.openai.com/v1
    model: text-embedding-3-small
    dimensions: 1536

rerankers:
  - id: my_reranker
    provider: bm25
    config:
      k1: 1.5
      b: 0.75
      epsilon: 0.25
      language: english
      tokenizer: default

# 단일 reranker 면 생략 가능 (rerankers 의 첫 항목이 자동 선택).
# rrf-hybrid 등 여러 항목을 등록한 경우 위쪽 (episodic_memory / retrieval_agent)
# 이 가리킬 reranker id 를 명시합니다.
# primary_reranker: my_reranker

llm_model:
  id: my_llm
  provider: openai-responses
  config:
    api_key: "<OPENAI_API_KEY>"
    base_url: https://api.openai.com/v1
    model: gpt-4o-mini

# (선택) Judge LLM. 생략하면 위의 llm_model 을 그대로 judge 로 재사용합니다.
# 답변 LLM 과 다른 endpoint / api_key / model 로 judge 를 띄우고 싶을 때만
# 아래 블록을 채우세요. provider 는 evaluation/retrieval_agent/llm_judge.py 가
# 지원하는 값이어야 합니다: openai-responses / openai-chat-completions / amazon-bedrock.
# id 가 llm_model.id 와 같다면 provider/config 도 동일해야 합니다 (충돌 방지).
# judge_llm:
#   id: my_judge
#   provider: openai-chat-completions
#   config:
#     api_key: "<OPENAI_API_KEY>"
#     base_url: https://api.openai.com/v1
#     model: gpt-4o
