# #5 — Temporal reasoning 약함 (LoCoMo Memory vs Agent, cat5 자동 skip)
# 출처: docs/msr/MemMachine_재현평가_설계_0425.md §2 #5
problem: 5
description: "LoCoMo — cat5 제외, length 만큼의 conversation group 으로 Memory vs Agent / Temporal vs Single-hop 비교"

benchmark:
  name: locomo
  data_path: evaluation/data/locomo10.json   # repo-root 기준 상대경로 (절대경로도 가능).
  length: 10   # locomo10.json 의 conversation group 수 (전체). CLI `--length N` 으로 override 가능.
  # cat5 (adversarial) skip 은 evaluation/retrieval_agent/locomo_search.py 에 자동 포함.

# 독립변수
sweep:
  test_target: [memmachine, retrieval_agent]

# 고정변수
fixed:
  search_limit: 20

# stage hooks
prompts:
  generate_prompt_file: null   # EDWIN 미사용 → 기본 ANSWER_PROMPT fallback

metrics:
  - per_category_llm_score   # 주목: Temporal vs Single-hop
