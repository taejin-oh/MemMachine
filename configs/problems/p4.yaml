# #4 — k 비단조성 (LongMemEval k sweep)
# 본 run 은 #6 (analyze --decompose-multisession) / #12 (analyze --pareto) 와 산출물 공유
problem: 4
description: "LongMemEval 500 — k sweep {10,20,30,50,100} (chunk=on, prefix=on)"

benchmark:
  name: longmemeval
  length: 500
  # Canonical split name aligned with the eval-tool default
  # (longmemeval_test.py). The earlier `longmemeval_s` value silently
  # diverged in score, so the cleaned variant is the single source of truth.
  split: longmemeval_s_cleaned
  # Local JSON wins over HF download. repo-root relative; generate_config.py
  # main() resolves to absolute. Comment out to fall back to HF online
  # (datasets loader → hf_hub_download).
  data_path: evaluation/data/longmemeval_s_cleaned.json

# 독립변수
sweep:
  search_limit: [10, 20, 30, 50, 100]

# 고정변수 (paper C12 조합 — 단, JSON-str=off 본 과제 방침)
fixed:
  prepend_user_prefix: true
  message_sentence_chunking: true   # chunk=on
  test_target: retrieval_agent

metrics:
  - overall_llm_score
  - per_category_llm_score   # SSU/SSP/SSA/TR/KU/MS
  - tokens_per_query
  - latency_per_query
