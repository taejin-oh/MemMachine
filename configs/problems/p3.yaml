# #3 — User/Assistant retrieval bias (LongMemEval prefix on/off)
problem: 3
description: "LongMemEval 500 — user_q prefix C5(off) vs C6(on) 외삽"

benchmark:
  name: longmemeval
  length: 500
  # Canonical split name aligned with the eval-tool default
  # (longmemeval_test.py). The earlier `longmemeval_s` value silently
  # diverged in score, so the cleaned variant is the single source of truth.
  split: longmemeval_s_cleaned
  # Local JSON wins over HF download. Comment out to fall back to HF online.
  data_path: evaluation/data/longmemeval_s_cleaned.json

# 독립변수
sweep:
  prepend_user_prefix: [false, true]

# 고정변수 (paper C5/C6 조합 — 단, JSON-str=off 본 과제 방침)
fixed:
  search_limit: 20
  message_sentence_chunking: false   # chunk=off
  test_target: retrieval_agent

metrics:
  - overall_llm_score
