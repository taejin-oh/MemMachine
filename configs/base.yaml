# MemMachine 재현 평가 도구 — 공통 base 설정
# 모든 run config 의 기본값. problem / run YAML 이 이 위에 deep-merge.

# 산출물 위치
results_dir: results

# configuration.yml 처리 모드
configuration:
  # "profile" : configs/profiles/{models,dbs}/*.yaml 조합으로 매 run 생성
  # "existing" : 사용자가 직접 만든 configuration.yml 경로 사용
  mode: profile

  # mode=profile 일 때 사용
  model_profile: null   # configs/profiles/models/{name}.yaml 의 {name}
  db_profile: null      # configs/profiles/dbs/{name}.yaml 의 {name}
  generated_dir: configs/generated   # 생성 파일 저장 위치

  # mode=existing 일 때 사용
  existing_path: null   # 절대 또는 repo-root 상대 경로

# Judge LLM override / runtime swap of retrieval_agent.judge_llm_model.
# null → use whatever the model profile's judge_llm baked in (or fall back
#        to llm_model when the profile has no judge_llm block).
# string → swap working configuration.yml's retrieval_agent.judge_llm_model
#          to that ID. The ID must already exist in resources.language_models.
# This override never touches retrieval_agent.llm_model (answer LLM).
#
# null 이면 model profile 의 judge_llm (없으면 llm_model) 을 그대로 사용.
# 값을 지정하면 working configuration.yml 의 retrieval_agent.judge_llm_model 을
# 그 ID 로 swap 합니다 (resources.language_models 에 미리 등록돼 있어야 함).
judge:
  llm_model_id: null

# 평가 기본값
evaluation:
  # LongMemEval abstention 처리 — question_id 에 "_abs" 가 들어간 행을
  # retrieve 단계에서 drop. default true (논문 baseline 보고가 비-abstention
  # 기준이라 점수 비교가 자연스러움). false 로 두면 abstention 행도 평가.
  exclude_abstention: true
  longmemeval:
    # question_type 필터. null/[] 이면 6 카테고리 모두 평가.
    # 부분 평가 예: ["multi-session"], ["temporal-reasoning","knowledge-update"]
    # 유효값: single-session-user / single-session-assistant /
    #         multi-session / temporal-reasoning / knowledge-update /
    #         single-session-preference
    # ingest 는 항상 전체 dataset 의 haystack 을 적재 (retrieval competition 보존).
    include_categories: null
  # 동시성 (기존 run_test.sh 와 동일 의미)
  ingest_concurrency: 4
  search_concurrency: 4
  judge_concurrency: 4

# 반복 실행. 현재 MVP 는 n_runs=1 만 지원.
# 그 외 값은 run_pipeline.py 가 NotImplementedError.
n_runs: 1
